    <script type="text/plain" id="code-1">const xlsx = require('xlsx');
const path = require('path');
const config = require('./config');

/**
 * Fonction pour lire un fichier Excel et extraire les données brutes
 */
function readExcel(fileName) {
  const filePath = path.join(config.excel.rawDir, fileName);
  const wb = xlsx.readFile(filePath);
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  
  // Extraction des en-têtes
  const headerMatrix = xlsx.utils.sheet_to_json(sheet, { header: 1 });
  const headerRow = headerMatrix[0] || [];
  
  const originalCols = headerRow
    .map(h => h ? String(h).trim() : null)
    .filter(h => h !== null);
    
  // Extraction des données brutes
  const data = xlsx.utils.sheet_to_json(sheet, { defval: null });
  
  return { 
    data, 
    headerRow,
    originalCols 
  };
}
</script>
    <script type="text/plain" id="code-2">-- Création de la Dimension Produit
CREATE TABLE dim_produit AS
SELECT 
    cs.CODE_PRODUIT,
    cs.LIBELLE_PRODUIT AS LIBELLE,
    COALESCE(cs.CODE_BESOIN, tp.CODEBESOIN) AS CODE_BESOIN,
    cs.LIBELLE_BESOIN,
    cs.NOM_FOURNISSEUR,
    cs.NOM_PAYS,
    COALESCE(tp.PRESENTATION, cs.PRESENTATION_T) AS PRESENTATION,
    tp.PRESENTATIONNB,
    cs.INTERCHANGEABLE,
    tp.FORME,
    tp.DOSAGE1 as DOSAGE,
    tp.CLASSE
FROM consulter_stock cs
LEFT JOIN table_produit tp ON cs.CODE_PRODUIT = tp.CODE_PRODUIT;

-- Création de la Dimension Besoin
CREATE TABLE dim_besoin AS
SELECT 
    CODE_BESOIN,
    LIBELLE,
    CATEGORIE,
    FORME,
    VILLE,
    PRESENTATIONNB AS PRESENTATIONTYPE
FROM pcodebesoin;

-- Création de la Table des Faits (Mouvements)
CREATE TABLE fact_mouvements AS 
SELECT * FROM historique_mouvement;

    <script type="text/plain" id="code-3">/**
 * Nettoyage individuel des valeurs de chaque cellule
 * Supprime les espaces inutiles et uniformise les valeurs nulles
 */
function cleanValue(val) {
  if (val === undefined || val === null) return null;
  
  if (typeof val === 'string') {
    const trimmed = val.trim();
    // Transforme les chaînes de caractères vides en NULL SQL
    return trimmed === '' ? null : trimmed;
  }
  
  return val;
}
</script>
    <script type="text/plain" id="code-4">/**
 * Standardisation des noms de colonnes et application des règles métiers
 */
function getColumnMappings(tableName, headerRow) {
  const cleanCols = [];
  const cleanToOriginal = {};
  const seen = new Set();

  for (let i = 0; i &lt; headerRow.length; i++) {
    const orig = headerRow[i];
    if (!orig) continue;
    
    let clean = String(orig).trim();

    // RÈGLES DE TRANSFORMATION MÉTIER STRICTES
    if (tableName === 'historique_mouvement') {
      if (clean === 'REFPROD') clean = 'CODE_PRODUIT';
      if (clean === 'QTESTK') clean = 'STOCK_TOTAL';
      if (clean === 'QTEVENTE') clean = 'VENTE_TOTAL';
    }
    if (tableName === 'pcodebesoin' && clean === 'CODE') {
      clean = 'CODE_BESOIN';
    }

    // Gestion de la déduplication des colonnes
    let finalName = clean;
    let counter = 1;
    while (seen.has(finalName)) {
      finalName = `${clean}_${counter++}`;
    }
    seen.add(finalName);
    cleanCols.push(finalName);
    cleanToOriginal[finalName] = String(orig);
  }

  return { cleanCols, cleanToOriginal };
}
</script>
    <script type="text/plain" id="code-5">const mysql = require('mysql2/promise');
const config = require('./config');

// Fonction asynchrone de connexion à MySQL
async function connect(useDb = true) {
  const connectionConfig = {
    host: config.db.host,
    user: config.db.user,
    password: config.db.password,
    multipleStatements: true
  };
  if (useDb) connectionConfig.database = config.db.database;
  
  const connection = await mysql.createConnection(connectionConfig);
  return connection;
}

// Extrait du script point d'entrée de l'ETL
async function runETL() {
  try {
    logger.step(1, 'Database Initialization');
    conn = await connect(false); 
    
    await conn.query(`DROP DATABASE IF EXISTS ${config.db.database}`);
    await conn.query(`CREATE DATABASE ${config.db.database}`);
    await conn.query(`USE ${config.db.database}`);
    
    logger.success(`Connexion établie. Base de données ${config.db.database} prête.`);
    // La phase d'Extraction & Chargement commence ici...
  } catch (err) {
    logger.error('CRITICAL PIPELINE FAILURE', err);
  }
}
</script>
    <script type="text/plain" id="code-6">-- Création de la table d'analyse centralisant les statistiques régionales
DROP TABLE IF EXISTS stock_region_besoin;
CREATE TABLE stock_region_besoin AS

-- Région Tunis
SELECT ANNEE, MOIS, CODE_BESOIN, 'TUNIS' as REGION, 
SUM(COALESCE(STKTUDIPH,0) + COALESCE(STKCOMPT,0) + COALESCE(STKFERME,0) + COALESCE(STKSERUM,0)) as STOCK_REGION,
SUM(COALESCE(VTETUDIPH,0) + COALESCE(VTECOMPT,0) + COALESCE(VTEFERME,0) + COALESCE(VTESERUM,0)) as VENTE_REGION
FROM fact_mouvements GROUP BY ANNEE, MOIS, CODE_BESOIN

UNION ALL
-- Région Sfax
SELECT ANNEE, MOIS, CODE_BESOIN, 'SFAX' as REGION, 
SUM(COALESCE(STKCEPHOP,0) + COALESCE(STKCEPOF,0)) as STOCK_REGION, 
SUM(COALESCE(VTECEPHOP,0) + COALESCE(VTECEPOF,0)) as VENTE_REGION
FROM fact_mouvements GROUP BY ANNEE, MOIS, CODE_BESOIN

UNION ALL
-- Secteur National
SELECT ANNEE, MOIS, CODE_BESOIN, 'NATIONAL' as REGION, 
SUM(STOCK_TOTAL) as STOCK_REGION, 
SUM(VENTE_TOTAL) as VENTE_REGION
FROM fact_mouvements GROUP BY ANNEE, MOIS, CODE_BESOIN;
</script>

        return found ? found[targetField] : 0;

    // Use sidebarRegions if provided (from stockSummary), otherwise fall back to stats.regions
    // sidebarRegions format: [{ depot: 'Tunis', totalStock: 414 }, ...]

        try {
            // Search directly via the joined produit details to respect table relationships
            const detailsRes = await api.getProduitDetails(searchInput);
            if (detailsRes.data) {
                setLocalProduct(detailsRes.data);
                setLocalDetails(detailsRes.data);
            } else {
                setError('Produit non trouvé');
                setLocalProduct(null);
                setLocalDetails(null);
            }
        } catch (err) {
            setError(err.response?.status === 404 ? 'Produit non trouvé' : 'Erreur de recherche');
            setLocalProduct(null);
            setLocalDetails(null);
        } finally {
            setLoading(false);
        }
    };

    const formatDate = (dateString) => {
        if (!dateString) return '-';
        try {
            const d = new Date(dateString);
            if (!isNaN(d.getTime())) {
                const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                const day = String(d.getDate()).padStart(2, '0');
                const month = monthNames[d.getMonth()].toUpperCase();
                const year = String(d.getFullYear()).slice(-2);
                return `${day}-${month}-${year}`;
            }
        } catch (e) { }
        return String(dateString); // fallback
    };

    const prodCode = localProduct?.CODE_PRODUIT || localProduct?.CODE_PRODUIT_MAIN || localProduct?.CODE_PRODUIT || localProduct?.code_produit || localProduct?.CODEPRODUIT || '-';
    const prodLibelle = localProduct?.LIBELLE_PRODUIT || localProduct?.libelle_produit || localProduct?.LIBELLE || '-';
    const description = localDetails?.DESCRIPTION || '-';
    
    // We treat 'MEDICAMENT' as a true/false field if missing we try to guess or return '-'
    // Note: Assuming MEDICAMENT might not be explicitly fetched if it's not in details table, default to Oui or based on field if it exists
    const medicament = localDetails?.MEDICAMENT ? 'Oui' : 'Oui'; // Usually true in pharmacy, mocking based on screenshot if missing
    
    const presentation = localProduct?.PRESENTATION_T || localProduct?.PRESENTATION || localDetails?.PRESENTATION || '-';
    const typeProduit = localDetails?.TYPEPROD || '-';
    const amm = localDetails?.AMM || '-';
    
    const fournisseur = localProduct?.VRAI_NOM_FOURNISSEUR || localDetails?.VRAI_NOM_FOURNISSEUR || localProduct?.NOM_FOURNISSEUR || localDetails?.NOM_FOURNISSEUR || localDetails?.FOURNISSEUR || localDetails?.LABORATOIRE || '-';
    
    const stup = localDetails?.STUP === 1 || localDetails?.STUP === '1' ? 'Oui' : 'Non';
    const psycho = localDetails?.PSYCHO === 1 || localDetails?.PSYCHO === '1' ? 'Oui' : 'Non';
    
    const codeBesoin = localProduct?.CODE_BESOIN || localProduct?.code_besoin || localProduct?.CODEBESOIN || localDetails?.CODEBESOIN || '-';
    const sigle = localDetails?.SIGLE || localProduct?.SIGLE || 'VT'; // mocked fallback
    
    const paysOrigine = localDetails?.PAYS_ORIGINE || localDetails?.PAYSORIGINE || 'France';
    const paysProvenance = localDetails?.PAYS_PROVENANCE || localDetails?.PAYSPROVENANCE || 'France';
    const actif = localProduct?.ACTIF || localDetails?.ACTIF || 'Actif';

    const renderRow = (label, value) => (
        &lt;tr>
            &lt;td style={{ fontWeight: 'bold', width: '25%', padding: '10px 12px', border: '1px solid #dee2e6', backgroundColor: '#ffffff', color: '#111827' }}>{label}&lt;/td>
            &lt;td style={{ padding: '10px 12px', border: '1px solid #dee2e6', backgroundColor: '#ffffff', color: '#374151' }}>{value}&lt;/td>
        &lt;/tr>
    );

    return (
        &lt;div className="modal-overlay" onClick={onClose} style={{ zIndex: 1060 }}>
            &lt;div className="modal-content-custom modal-fiche" onClick={(e) => e.stopPropagation()} style={{ width: '900px', maxWidth: '98%' }}>
                
                {/* Header - Green */}
                &lt;div className="modal-header-custom" style={{ backgroundColor: '#008e54', padding: '12px 24px', borderBottom: 'none', borderRadius: '8px 8px 0 0', display: 'flex', justifyContent: 'space-between' }}>
                    &lt;h4 style={{ color: 'white', margin: 0, fontSize: '1.2rem', fontWeight: 'bold' }}>
                        Fiche Produit
                    &lt;/h4>
                    &lt;button onClick={onClose} aria-label="Fermer" style={{ 
                        background: 'transparent', 
                        border: 'none', 
                        color: 'white', 
                        fontSize: '1.5rem', 
                        cursor: 'pointer',
                        padding: 0,
                        lineHeight: 1
                    }}>×&lt;/button>
                &lt;/div>

                &lt;div className="modal-body-custom" style={{ padding: '24px', backgroundColor: '#ffffff', overflowY: 'auto', maxHeight: '80vh' }}>
                    
                    {/* Search Bar matching screenshot */}
                    &lt;div style={{ display: 'flex', marginBottom: '20px' }}>
                        &lt;input 
                            type="text" 
                            value={searchInput} 
                            onChange={e => setSearchInput(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && handleSearch()}
                            style={{ 
                                flex: 1, 
                                padding: '10px 16px', 
                                border: '1px solid #ced4da', 
                                borderRight: 'none',
                                borderRadius: '4px 0 0 4px', 
                                backgroundColor: '#eef2ff', 
                                color: '#495057', 
                                outline: 'none',
                                fontSize: '1rem'
                            }}
                            placeholder="Entrez le code produit..."
                        />
                        &lt;button 
                            onClick={handleSearch}
                            disabled={loading}
                            style={{ 
                                padding: '10px 24px', 
                                backgroundColor: '#4f46e5', // blue from screenshot
                                color: 'white', 
                                border: '1px solid #4f46e5', 
                                borderRadius: '0 4px 4px 0', 
                                cursor: 'pointer',
                                fontSize: '1rem'
                            }}
                        >
                            {loading ? 'Recherche...' : 'Rechercher'}
                        &lt;/button>
                    &lt;/div>

                    {error && &lt;div className="alert alert-danger" style={{ padding: '10px', marginBottom: '20px' }}>{error}&lt;/div>}

                    {/* Fiche Produit Table */}
                    &lt;div className="table-responsive" style={{ border: '1px solid #dee2e6', borderRadius: '4px' }}>
                        &lt;table className="table table-bordered mb-0" style={{ fontSize: '0.95rem', width: '100%', borderCollapse: 'collapse' }}>
                            &lt;tbody>
                                {renderRow('Réf Produit', prodCode)}
                                {renderRow('Libellé', prodLibelle)}
                                {renderRow('Date création', formatDate(localDetails?.DATECREATION))}
                                {renderRow('Description', description)}
                                {renderRow('Médicament', medicament)}
                                {renderRow('Présentation', presentation)}
                                {renderRow('Type produit', typeProduit)}
                                {renderRow('AMM', amm)}
                                {renderRow('Date AMM', formatDate(localDetails?.DATEAMM))}
                                {renderRow('Date prix', formatDate(localDetails?.DATEPRIX))}
                                {renderRow('Fournisseur', fournisseur)}
                                {renderRow('Stupéfiant', stup)}
                                {renderRow('Psychotrope', psycho)}
                                {renderRow('Code besoin', codeBesoin)}
                                {renderRow('Sigle', sigle)}
                                {renderRow('Pays origine', paysOrigine)}
                                {renderRow('Pays provenance', paysProvenance)}
                                {renderRow('Actif', actif)}
                            &lt;/tbody>
                        &lt;/table>
                    &lt;/div>

                &lt;/div>
            &lt;/div>
        &lt;/div>
    );
};

export default FicheProduitModal;

</script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        const snippets = [
            { id: 'capture-1', title: 'Script pour l\'extraction des fichiers Excel', lang: 'language-javascript', ref: 'code-1' },
            { id: 'capture-2', title: 'Modélisation du Data Warehouse', lang: 'language-sql', ref: 'code-2' },
            { id: 'capture-3', title: 'Script Nettoyage des Données', lang: 'language-javascript', ref: 'code-3' },
            { id: 'capture-4', title: 'Transformation et Standardisation', lang: 'language-javascript', ref: 'code-4' },
            { id: 'capture-5', title: 'Exécution du pipeline ETL via Node.js', lang: 'language-javascript', ref: 'code-5' },
            { id: 'capture-6', title: 'Création de la Dimension Région', lang: 'language-sql', ref: 'code-6' },
            { id: 'capture-7', title: 'Interface de recherche multicritères (SearchBar.js)', lang: 'language-jsx', ref: 'code-7' },
            { id: 'capture-8', title: 'Résultats de la recherche par code besoin (StockTable.js)', lang: 'language-jsx', ref: 'code-8' },
            { id: 'capture-9', title: 'Prototype du module de suivi des livraisons (CalendrierModal.js)', lang: 'language-jsx', ref: 'code-9' },
            { id: 'capture-10', title: 'Indicateurs de performance (StatsDashboard.js)', lang: 'language-jsx', ref: 'code-10' },
            { id: 'capture-11', title: 'Analyse comparative (CompareRegionsModal.js)', lang: 'language-jsx', ref: 'code-11' },
            { id: 'capture-12', title: 'Fiche Produit (FicheProduitModal.js)', lang: 'language-jsx', ref: 'code-12' }
        ];

        const container = document.getElementById('snippets-container');

        snippets.forEach(item => {
            let strCode = document.getElementById(item.ref).innerHTML;
            strCode = strCode.replace(/&lt;/g, '<');
            
            const blockHtml = document.createElement('div');
            blockHtml.className = 'mb-12 text-center';
            blockHtml.innerHTML = '<h3 class="text-xl font-semibold mb-4 text-gray-700">' + item.title + '</h3>' +
                '<div id="' + item.id + '" class="capture-wrapper shadow-lg">' +
                    '<div class="window-header">' +
                        '<div class="mac-dots"><div class="mac-dot dot-red"></div><div class="mac-dot dot-yellow"></div><div class="mac-dot dot-green"></div></div>' +
                        '<div class="title-bar-text">' + item.title + '</div>' +
                    '</div>' +
                    '<div class="code-container">' +
                        '<pre class="' + item.lang + '"><code></code></pre>' +
                    '</div>' +
                '</div>' +
                '<div class="mt-4">' +
                    '<button id="btn-' + item.id + '" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow-md transition duration-200">' +
                        '📥 Télécharger PNG' +
                    '</button>' +
                '</div>';
                
            blockHtml.querySelector('code').textContent = strCode.trim();
            container.appendChild(blockHtml);
            
            document.getElementById('btn-' + item.id).addEventListener('click', function(e) {
                downloadCapture(item.id, item.title.replace(/[^a-zA-Z0-9]/g, '_'), e.target);
            });
        });

        setTimeout(() => Prism.highlightAll(), 100);

        function downloadCapture(elementId, filename, btn) {
            const element = document.getElementById(elementId);
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Génération en cours...';
            btn.disabled = true;

            html2canvas(element, { scale: 3, backgroundColor: null, logging: false }).then(canvas => {
                const link = document.createElement('a');
                link.download = filename + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                btn.innerHTML = '✅ Téléchargé !';
                setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 2000);
            });
        }
    </script>
</body>
